talk_about_the_future:
- Speaker: Unnamed
  Line: There’s something you have to know about your radio, Mariposa.
  Icon: Neutral
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Unnamed
  Line: You said you modified it. It was an old two-way; you rearranged it. Gave it a new shell and fixed it up. Didn’t think it would work. And it receives a signal you cannot trace.
  Icon: Neutral
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Mariposa
  Line: Well, yes? Actually, I can track it, it’s just spitting out a result that doesn’t make any sense. Says it’s actually not picking up a signal at all, and it’s coming from—
  Icon: Neutral
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Unnamed
  Line: –right where you are, correct?
  Icon: Neutral
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Unnamed
  Line: It’s because that signal is from itself. It’s picking up its own transmissions and relaying them back into the same place; just a different time.
  Icon: Neutral
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Mariposa
  Line: '...Kairo, what are you saying?'
  Icon: Sad
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Unnamed
  Line: You said it yourself. It’s an antique; it doesn’t have self-interference cancellation, and it certainly didn’t when you tried to install your upgraded transmitters.
  Icon: Neutral
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Unnamed
  Line: Somehow, your modification is allowing you to safely project signals faster than what should be possible—and it’s coming back down to Earth a hundred years too late.
  Icon: Neutral
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Unnamed
  Line: '...and receive signals a hundred years too early.'
  Icon: Neutral
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Unnamed
  Line: '...'
  Icon: Neutral
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Unnamed
  Line: Do you understand what I’m saying?
  Icon: Neutral
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Mariposa
  Line: '...'
  Icon: Sad
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Mariposa
  Line: '...'
  Icon: Neutral
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Mariposa
  Line: '...you asked me once about the future. The future, Kairo? The future?'
  Icon: Happy
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Mariposa
  Line: Are you kidding me? This is—
  Icon: Neutral
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Mariposa
  Line: -this is amazing!
  Icon: Happy
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Mariposa
  Line: I can’t believe you didn’t tell me sooner! I mean—-maybe you didn’t know—-I certainly didn’t—--
  Icon: Neutral
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Mariposa
  Line: You’ve—-I’ve—-we’ve done something incredible! Kairo, this is a dream come true!
  Icon: Happy
  Background: 
  FromRadio: 
  Sounds: []
  Events: []
  Choice1: 
  Choice2: 
- Speaker: Mariposa
